<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop Manager Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-panel">
      <div class="brand-mark">WM</div>
      <h1>Workshop Manager</h1>
      <form method="post" class="login-form">
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <label>Username<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-btn" type="submit">Log in</button>
      </form>
      <p class="hint">Default admin: admin / admin123</p>
    </section>
  </main>
</body>
</html>
